<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>트리마제 38A · 방3 통로형 드레스룸</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
      background: #f3efe6;
      color: #1a1a1a;
    }
    header {
      padding: 28px 32px 12px;
      max-width: 1680px;
      margin: 0 auto;
    }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { margin: 0 0 8px; color: #5c5c5c; font-size: 14px; }
    .warn { color: #c0392b; font-size: 13px; }
    .board {
      padding: 0 16px 48px;
      overflow: auto;
    }
    .board img, .board object {
      width: min(1680px, 100%);
      height: auto;
      display: block;
      margin: 0 auto;
      background: #f7f4ee;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,.08);
    }
  </style>
</head>
<body>
  <header>
    <h1>트리마제 38A · 방3 통로형 드레스룸</h1>
    <p>전용 84.82㎡ / 공급 126.66㎡ · 첨부 38A 평면 기준</p>
    <p class="warn">치수는 평면도 스케일 환산값이다. 현장 실측이 공개되어 있지 않으며, 시공 전 해당 세대 실측이 필요하다.</p>
  </header>
  <div class="board">
    <object data="trimage-38a-room3-dressing.svg" type="image/svg+xml" aria-label="38A 기존/변경 평면도">
      <img src="trimage-38a-room3-dressing.svg" alt="트리마제 38A 방3 통로형 드레스룸 평면도" />
    </object>
  </div>
</body>
</html>
